# Commented copy of ../../../../notebooks/code/kube-config/model-deployment.yaml (lessons 10.7, 10.8).
# GOAL:   run the TF Serving image (model baked in) as pods.
# NOTE:   the repo file is the FINAL, EKS version (10.8): `image` points to Alexey's ECR registry, which you
#         cannot pull from. For the local kind run (10.7) the lesson uses the local tag
#         zoomcamp-10-model:xception-v4-001 (after `kind load docker-image zoomcamp-10-model:xception-v4-001`).
# SYNTAX: kubectl apply -f model-deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tf-serving-clothing-model
spec:
  replicas: 1
  # WHY:    selector <-> template label must match; model-service.yaml selects the same label.
  selector:
    matchLabels:
      app: tf-serving-clothing-model
  template:
    metadata:
      labels:
        app: tf-serving-clothing-model
    spec:
      containers:
      - name: tf-serving-clothing-model
        # SYNTAX: <account>.dkr.ecr.<region>.amazonaws.com/<repository>:<tag>  - an ECR image address.
        image: 387546586013.dkr.ecr.eu-west-1.amazonaws.com/mlzoomcamp-images:zoomcamp-10-model-xception-v4-001
        resources:
          # WHY:  the model holds Xception's weights in RAM, so it gets 4x the gateway's memory.
          #       Lesson 10.7: with cpu: 1 the pod stayed Pending (the kind node had no free CPU);
          #       0.5 fits. Pending + "Insufficient cpu" in `kubectl describe pod` = lower the request/limit.
          #       With only limits set, Kubernetes uses them as the requests too.
          limits:
            memory: "512Mi"
            cpu: "0.5"
        ports:
        # WHY:  8500 = TF Serving's gRPC port.
        - containerPort: 8500
